m2-browser:
  stage: browser
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - python --version
    - python -m venv .venv
    - .venv/bin/python -m pip install --require-hashes -r requirements/bootstrap.lock
    - .venv/bin/python -m pip install --require-hashes -r requirements/dev.lock
    - .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
    - .venv/bin/python -m playwright install --with-deps chromium
  script:
    - .venv/bin/python scripts/repo_checks.py --require-disclosure --require-signed-commit
    - .venv/bin/pytest -m browser tests/browser --no-cov --junitxml=.artifacts/m2/browser-junit.xml
    - .venv/bin/python scripts/repo_checks.py --scan-extra .artifacts/m2
  artifacts:
    when: on_success
    expire_in: 30 days
    reports:
      junit: .artifacts/m2/browser-junit.xml
    paths:
      - .artifacts/m2/browser-junit.xml
      - .artifacts/m2/browser-manifest.json
      - DISCLOSURE

m2-acceptance:
  stage: acceptance
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
  needs:
    - job: m2-model-control
      artifacts: true
    - job: m2-browser
      artifacts: true
  before_script:
    - python --version
    - python -m venv .venv
    - .venv/bin/python -m pip install --require-hashes -r requirements/bootstrap.lock
    - .venv/bin/python -m pip install --require-hashes -r requirements/dev.lock
    - .venv/bin/python -m pip install --no-deps --no-build-isolation -e .
  script:
    - .venv/bin/python scripts/repo_checks.py --require-disclosure --require-signed-commit
    - .venv/bin/python scripts/write_acceptance_manifest.py --milestone M2 --commit "$CI_COMMIT_SHA" --output .artifacts/m2/acceptance-manifest.json
    - .venv/bin/python scripts/validate_acceptance_manifest.py .artifacts/m2/acceptance-manifest.json
    - .venv/bin/python scripts/repo_checks.py --scan-extra .artifacts/m2
  artifacts:
    when: on_success
    expire_in: 30 days
    paths:
      - .artifacts/m2/acceptance-manifest.json
      - .artifacts/m2/browser-manifest.json
      - .artifacts/m2/migration-manifest.json
      - DISCLOSURE

